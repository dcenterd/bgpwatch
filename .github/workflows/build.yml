name: build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write        # attach the Windows zip to a release

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Unit tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m unittest discover -s tests -v
      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s tests -v

  windows-exe:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build bgpwatch.exe (PyInstaller)
        shell: cmd
        run: packaging\build_windows.bat
      - name: Smoke test the exe (starts, polls, RPKI, log, screenshot)
        shell: powershell
        run: powershell -File packaging\smoke_windows.ps1 dist\bgpwatch\bgpwatch.exe smoke
      - name: Zip
        shell: bash
        run: |
          VERSION=$(python -c "import re;print(re.search(r'\"(.+?)\"', open('bgpwatch/__init__.py').read().split('__version__')[1]).group(1))")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cp README.md LICENSE dist/bgpwatch/
          powershell -Command "Compress-Archive -Path dist/bgpwatch -DestinationPath bgpwatch-$VERSION-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: bgpwatch-windows
          path: |
            bgpwatch-*-windows-x64.zip
            smoke/windows.png
            smoke/logs/demo/bgpwatch.log
      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" bgpwatch-*-windows-x64.zip --clobber
